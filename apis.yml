aid: intarcia-therapeutics
name: Intarcia Therapeutics
description: >-
  Intarcia Therapeutics, Inc. was a Boston-headquartered clinical-stage biopharmaceutical and
  drug-delivery company, founded in 1997 and once valued at roughly $5.5B, that developed the
  Medici Drug Delivery System — a matchstick-sized subdermal osmotic mini-pump engineered to
  stabilize therapeutic proteins and peptides at body temperature and release them continuously
  for months from a single placement. Its lead candidate, ITCA 650, delivered the GLP-1 receptor
  agonist exenatide for type 2 diabetes over three- to six-month intervals. The FDA issued
  complete response letters on the ITCA 650 new drug application in 2017 and again in 2020, after
  which the company ran out of capital, laid off staff, closed its Boston, Hayward (CA) and
  Durham (NC) sites and liquidated its manufacturing and laboratory equipment at auction. Its
  remaining assets — the Medici platform and ITCA 650 — were acquired by i2o Therapeutics in
  August 2023, and FDA published a final decision refusing to approve the ITCA 650 application on
  2024-08-23. Intarcia was a drug-device developer rather than a software company: its corporate
  site carried only Medici System, Pipeline, Newsroom, About, Leadership and Careers sections and
  never published a developer program, public API, SDK, webhook surface or machine-readable
  specification of any kind. As of 2026-08-23 both intarcia.com and intarciatherapeutics.com
  resolve to an Atom.com domain-broker parking page that offers the names for sale and returns
  HTTP 404 on every path, and no developer-facing subdomain resolves. This profile is retained as
  a historical record; there is no API surface to enrich.
